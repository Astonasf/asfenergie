<div id="lightbox" class="lightbox-overlay">
  <button class="lightbox-close" aria-label="Fermer">&times;</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  (function () {
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    var closeBtn = lightbox.querySelector('.lightbox-close');

    document.querySelectorAll('.gallery-item img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = this.src;
        lightboxImg.alt = this.alt;
        lightbox.classList.add('active');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  })();
</script>


<div class="fab-wa-wrap">

  </button>
</div>

<script>
(function () {
  var btn = document.getElementById('fab-wa-btn');
  var popup = document.getElementById('fab-popup');
  if (!btn || !popup) return;
  function closePopup() {
    popup.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
    popup.setAttribute('aria-hidden', 'true');
  }
  function togglePopup(e) {
    e.stopPropagation();
    var isOpen = popup.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    popup.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
  }
  btn.addEventListener('click', togglePopup);
  document.addEventListener('click', function (e) {
    if (!popup.contains(e.target) && e.target !== btn) closePopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePopup();
  });
})();
</script>
