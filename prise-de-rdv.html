<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prise de rendez-vous - AsfEnergie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <a href="index.html" class="logo-link" aria-label="Accueil AsfEnergie"><img src="img/logo-asfenergie1.png" alt="Logo ASF Energie" class="logo" /></a>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="realisations.html">Nos réalisations</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="devis-ou-rdv.html" class="devis">Devis gratuit</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="form-section">
    <h2>Prise de rendez-vous en ligne</h2>
    <form action="https://formspree.io/f/mrblejrw" method="post" class="styled-form">
      <input type="hidden" name="_subject" value="Nouvelle demande de RDV - AsfEnergie">
      <label for="date">Choisissez une date</label>
      <input type="date" id="date" name="date" required>

      <label for="heure">Heure</label>
      <input type="time" id="heure" name="heure" required>

      <label for="commentaire">Commentaire</label>
      <textarea id="commentaire" name="commentaire" rows="5" placeholder="Votre commentaire..."></textarea>

      <button type="submit" class="btn-yellow">Valider la demande</button>
    </form>
  </section>

<footer class="footer">
  <p>&copy; 2026 AsfEnergie - Tous droits réservés</p>
</footer>

<script>
  const form = document.querySelector('.styled-form');
  const dateInput = document.getElementById('date');
  const timeInput = document.getElementById('heure');
  const commentInput = document.getElementById('commentaire');

  form.addEventListener('submit', function (e) {
    if (!dateInput.value || !timeInput.value || !commentInput.value.trim()) {
      e.preventDefault();
      alert("Merci de remplir tous les champs avant de valider la demande.");
    }
  });
</script>

<div class="fab-wa-wrap">
  <div class="fab-popup" id="fab-popup" role="dialog" aria-hidden="true">
    <p class="fab-popup-label">Contactez-nous au</p>
    <p class="fab-popup-number">06 22 03 98 21</p>
  </div>
  <button type="button" class="fab-wa" id="fab-wa-btn" aria-label="Afficher le numéro de téléphone" aria-expanded="false" aria-controls="fab-popup">
    <svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.7.8 1.9.1.2.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.4.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.4.2.5.3.1.2.1.9-.1 1.5z"/></svg>
  </button>
</div>

<script>
(function () {
  var btn = document.getElementById('fab-wa-btn');
  var popup = document.getElementById('fab-popup');
  if (!btn || !popup) return;
  function closePopup() {
    popup.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
    popup.setAttribute('aria-hidden', 'true');
  }
  function togglePopup(e) {
    e.stopPropagation();
    var isOpen = popup.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    popup.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
  }
  btn.addEventListener('click', togglePopup);
  document.addEventListener('click', function (e) {
    if (!popup.contains(e.target) && e.target !== btn) closePopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePopup();
  });
})();
</script>

</body>
</html>
